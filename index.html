<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="var(--background)">
<title>Подбор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
--background:oklch(0.954 0.005 258.325);--foreground:oklch(0.222 0.013 264.276);
--card:oklch(1 0 0);--primary:oklch(0.483 0.087 255.055);--primary-hover:oklch(0.42 0.087 255.055);
--primary-foreground:oklch(1 0 0);--secondary:oklch(0.603 0.111 41.853);
--muted:oklch(0.937 0.006 264.532);--muted-2:oklch(0.921 0.008 260.732);--muted-foreground:oklch(0.491 0.03 270.744);
--text-2:oklch(0.38 0.02 266);--text-3:oklch(0.62 0.02 266);
--accent:oklch(0.909 0.02 252.887);--accent-soft:oklch(0.955 0.012 252.887);--accent-foreground:oklch(0.345 0.069 255.027);
--destructive:oklch(0.524 0.171 27.045);--destructive-strong:oklch(0.44 0.15 27.045);--destructive-soft:oklch(0.95 0.025 27.045);
--success:oklch(0.48 0.077 152.712);--success-soft:oklch(0.955 0.025 152.712);--success-mid:oklch(0.9 0.06 140);
--warning:oklch(0.5 0.1 60);--warning-strong:oklch(0.42 0.09 60);--warning-soft:oklch(0.96 0.035 84.384);--warning-softer:oklch(0.98 0.02 84.384);
--border:oklch(0.853 0.014 258.349);--border-soft:oklch(0.9 0.01 258.349);--ring:oklch(0.618 0.07 257.815);
--shadow-rgb:24,27,33;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--background);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{width:100%;max-width:430px;height:100dvh;margin:0 auto;background:var(--background);color:var(--foreground);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:700px){body{display:flex;align-items:center;justify-content:center;min-height:100vh}#app{height:min(844px,calc(100vh - 40px));max-width:390px;border-radius:36px;box-shadow:0 30px 80px rgba(var(--shadow-rgb),.18)}}
#app.wide{max-width:none;width:100vw;height:100vh;border-radius:0;box-shadow:none;flex-direction:row;background:var(--background)}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;position:relative}
.pane.left{width:400px;flex:none;background:var(--background);box-shadow:1px 0 0 rgba(var(--shadow-rgb),.06)}
.pane.right{flex:1;background:var(--muted-2)}
.pane.right .scroll,.pane.right .dock-wrap{width:100%;max-width:760px;margin:0 auto}
.pane.right .top{width:100%;max-width:760px;margin:0 auto}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted-foreground)}
button,input,textarea{font-family:inherit}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;min-height:66px}
.top-t{flex:1;min-width:0}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top p{margin:2px 0 0;font-size:13px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:14px;border:0;background:var(--card);color:var(--foreground);cursor:pointer;padding:0}
.scroll{flex:1;overflow-y:auto;padding:6px 16px 28px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:16px;border:0;font-size:15px;font-weight:600;cursor:pointer;width:100%;text-decoration:none;flex:none;color:var(--foreground);background:var(--muted)}
.btn.white{background:var(--card)}
.b-pri{background:var(--foreground);color:var(--card)}
.b-acc{background:var(--primary);color:var(--card)}
.b-off{background:var(--border-soft);color:var(--muted-foreground)}
.b-ghost{background:none;color:var(--muted-foreground);min-height:44px}
.b-sm{min-height:44px;font-size:14px;width:auto;padding:0 14px;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.35;border:0}
button.chip{cursor:pointer;font-family:inherit}
.lbl{font-size:13px;font-weight:500;color:var(--muted-foreground);margin:0}
.muted{color:var(--muted-foreground);font-size:13px;margin:0}
.row{display:flex;align-items:center;gap:8px}
.sb{justify-content:space-between}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i-s{width:16px;height:16px}
.i-l{width:30px;height:30px;stroke-width:1.5}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);padding:6px 8px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 rgba(var(--shadow-rgb),.05)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;border:0;background:none;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted-foreground)}
.tab.on{color:var(--primary)}
.sec-h{display:flex;align-items:baseline;gap:8px;padding:8px 4px 0}
.sec-h h2{margin:0;font-size:17px;font-weight:700;flex:1;letter-spacing:-.01em;text-align:left}
.sec-btn{border:0;background:none;width:100%;cursor:pointer;align-items:center;padding:8px 4px 2px;color:inherit;font-family:inherit}
.sec-btn .chev{transition:transform .2s;color:var(--text-3)}
.sec-btn.closed .chev{transform:rotate(-90deg)}
.cand{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:20px;padding:12px;font-size:15px;color:inherit;cursor:pointer}
.cand-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.thumb{width:56px;height:52px;border-radius:14px;background:var(--muted);color:var(--text-3);display:flex;align-items:center;justify-content:center;flex:none}
.ct{font-weight:600;font-size:15px}
.cm{font-size:13px;color:var(--muted-foreground)}
.price{font-weight:600;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted-foreground)}
.inp{min-height:52px;border:0;border-radius:14px;padding:0 16px;font-size:16px;background:var(--muted);color:var(--foreground);width:100%;outline-color:var(--primary)}
textarea.inp{padding:14px 16px;min-height:120px;resize:none;line-height:1.45}
.inp.big{font-size:24px;font-weight:700;min-height:60px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;font-size:14px;margin:0;align-items:center}
.kv dt{color:var(--muted-foreground)}
.kv dd{margin:0;text-align:right;font-weight:600}
.seg{display:flex;background:var(--muted);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--text-2)}
.seg button.on{background:var(--card);color:var(--foreground);box-shadow:0 1px 3px rgba(var(--shadow-rgb),.10)}
.toast{position:absolute;left:16px;right:16px;bottom:90px;max-width:420px;margin:0 auto;background:var(--foreground);color:var(--card);border-radius:16px;padding:13px 16px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px rgba(var(--shadow-rgb),.22);z-index:20;animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.banner{border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.4;border:0;text-align:left;width:100%;color:inherit;font-family:inherit}
.banner p{margin:2px 0 0;opacity:.85}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none;scrollbar-width:none}
.pill{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--foreground)}
.pill.on{background:var(--foreground);color:var(--card)}
.pill.soft{background:var(--muted)}
.pill.soft.on{background:var(--foreground);color:var(--card)}
.pill.danger.on{background:var(--destructive);color:var(--card)}
.bubble{max-width:86%;border-radius:18px;padding:10px 14px;font-size:14px;line-height:1.45}
.hr{height:1px;background:var(--muted)}
.diff{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35}
.diff span{color:var(--foreground)}
.mask{background:var(--foreground);color:var(--card);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.rm{background:var(--border-soft);color:var(--muted-foreground);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:12px;border:0;background:var(--muted);font-size:18px;font-weight:600;cursor:pointer;color:var(--foreground)}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0}
.cell{height:56px;border-radius:14px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.cell.cur{box-shadow:inset 0 0 0 2px var(--primary);background:var(--card)}
.h-big{margin:0;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.sw{position:absolute;inset:0;background:var(--card);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:0 12px 32px rgba(var(--shadow-rgb),.08);transition:transform .24s ease}
.sw.drag{transition:none;cursor:grabbing}
.stamp{position:absolute;top:18px;padding:6px 12px;border-radius:10px;font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--card);pointer-events:none;opacity:0}
.ph{background:var(--border-soft);color:var(--text-3);display:flex;align-items:center;justify-content:center;position:relative}
.switch{width:44px;height:26px;border-radius:13px;padding:3px;display:flex;flex:none;background:var(--border);justify-content:flex-start;transition:background .2s}
.switch.on{background:var(--primary);justify-content:flex-end}
.switch span{width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:none}
.radio.on{border:6px solid var(--primary)}
.vcard{background:var(--card);border-radius:20px;overflow:hidden}
.vcard.picked{box-shadow:inset 0 0 0 2px var(--primary)}
.vrow{display:flex;align-items:stretch}
.ck{width:52px;flex:none;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ck span{width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--border);display:flex;align-items:center;justify-content:center;color:var(--card)}
.ck.on span{background:var(--primary);box-shadow:none}
.vmain{flex:1;min-width:0;border:0;background:none;text-align:left;padding:12px 14px 12px 0;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:3px;font-family:inherit;font-size:15px}
.vexp{padding:0 16px 16px 52px;display:flex;flex-direction:column;gap:10px}
.dock{flex:none;background:var(--card);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;box-shadow:0 -1px 0 rgba(var(--shadow-rgb),.06)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--muted);margin:14px 0 22px}
.bar .rng{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.bar .mk{position:absolute;top:-5px;width:2px;height:18px;border-radius:1px}
.bar .mk em{position:absolute;top:20px;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:600;white-space:nowrap}
.paper{background:var(--card);border-radius:6px;box-shadow:0 8px 24px rgba(var(--shadow-rgb),.10);padding:22px 20px;font-size:12px;line-height:1.45;color:var(--foreground)}
.paper h3{margin:0;font-size:17px}
.sr{position:absolute;left:-9999px}
/* компактность и состояния */
.top{min-height:58px;padding-bottom:8px}
.top h1{font-size:19px}
.scroll{gap:10px;padding:4px 16px 24px}
.scroll>*{flex-shrink:0}
.card{padding:14px;gap:10px;border-radius:18px}
.btn{min-height:48px;transition:transform .12s ease,filter .15s ease,background-color .15s ease}
.btn:active,.cand:active,.pill:active,.ib:active,.tab:active,.li:active,.ck:active,.vmain:active{transform:scale(.98)}
@media (hover:hover){.btn:hover,.pill:hover,.ib:hover{filter:brightness(.96)}.li:hover,.cand:hover{background:var(--accent-soft)}}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[aria-disabled="true"]{cursor:not-allowed}
.group{background:var(--card);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.group>*+*{box-shadow:inset 0 1px 0 var(--muted)}
.li{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;padding:12px 16px;font-family:inherit;font-size:15px;color:inherit;cursor:pointer;transition:background-color .15s ease}
.li.active{background:var(--accent-soft)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;padding:10px 12px;border-radius:12px}
.note b{font-weight:600}
.jumpbar{position:sticky;top:-4px;z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--muted);padding:4px;border-radius:14px;margin:0 -2px}
.jumpbar button{border:0;background:transparent;border-radius:11px;min-height:44px;font-family:inherit;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.2}
.jumpbar button b{font-size:15px;color:var(--foreground)}
.jumpbar button.hot{background:var(--primary);color:var(--card)}
.jumpbar button.hot b{color:var(--card)}
.pane.right .jumpbar{top:0}
.cap{font-size:12px;color:var(--muted-foreground);margin-top:-4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
/* ---- лейаут в духе Bond ---- */
.top{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;min-height:60px;padding:calc(10px + env(safe-area-inset-top)) 16px 6px}
.top-t{text-align:center}
.top h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.top p{font-size:12px;margin-top:1px}
.top .sp{width:44px}
.ib{width:40px;height:40px;border-radius:50%;background:var(--muted-2);justify-self:center;align-self:center}
.ib.dark{background:var(--foreground);color:var(--card)}
.btn{border-radius:999px;min-height:52px;font-weight:500}
.b-sm{border-radius:999px;font-weight:500}
.btn.white{box-shadow:0 1px 2px rgba(var(--shadow-rgb),.06)}
.card{border-radius:20px;padding:16px}
.group{background:none;gap:8px;border-radius:0;overflow:visible}
.group>*+*{box-shadow:none}
.li{border-radius:20px;padding:14px 16px}
.li .ct{font-size:16px;font-weight:500}
.vcard{border-radius:20px}
.cand{border-radius:20px}
.pills{gap:8px}
.pill{background:var(--muted-2);font-weight:500;font-size:14px;min-height:38px}
.pill.on,.pill.soft.on{background:var(--foreground);color:var(--card)}
.chip{font-weight:500;border-radius:8px;padding:3px 8px}
.seg{border-radius:999px;background:var(--muted-2)}
.seg button{border-radius:999px;font-weight:500}
.inp{background:var(--card);border-radius:16px}
.sec-h h2{font-size:15px;font-weight:600;color:var(--muted-foreground);letter-spacing:0}
.jumpbar{border-radius:999px;background:var(--muted-2)}
.jumpbar button{border-radius:999px}
.tabs{display:flex;justify-content:center;gap:36px;background:transparent;box-shadow:none;padding:4px 16px calc(12px + env(safe-area-inset-bottom))}
.tab{width:48px;min-height:44px;color:var(--text-3)}
.tab span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tab .i{width:24px;height:24px}
.tab.on{color:var(--foreground)}
.tab.on .i{stroke-width:2.4}
.dock{margin:0 12px calc(10px + env(safe-area-inset-bottom));border-radius:28px;padding:10px 10px 10px 18px;box-shadow:0 6px 24px rgba(var(--shadow-rgb),.10)}
.toast{border-radius:999px}
.banner{border-radius:20px}
.note{border-radius:16px}
/* вход */
.auth{flex:1;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));min-height:0;overflow-y:auto}
.wm{font-weight:800;font-size:26px;letter-spacing:-.04em;text-align:center;line-height:1}
.auth-h{margin:40px 0 0;text-align:center;font-size:22px;font-weight:400;letter-spacing:-.01em}
.auth-s{margin:6px 0 0;text-align:center;color:var(--muted-foreground);font-size:15px}
.rolebar{display:flex;justify-content:center;gap:8px;margin-top:18px}
.foot{margin-top:auto;display:flex;align-items:center;gap:14px;padding-top:20px}
.foot-t{flex:1;font-size:12px;line-height:1.45;color:var(--muted-foreground);text-align:center}
.foot-t button{border:0;background:none;padding:0;font:inherit;color:var(--foreground);font-weight:500;cursor:pointer}
.fab{width:56px;height:56px;border-radius:50%;border:0;flex:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .2s,transform .12s}
.fab.on{background:var(--primary);color:var(--primary-foreground)}
.fab.off{background:var(--border);color:var(--card)}
.fab:active{transform:scale(.95)}
.otp{display:flex;justify-content:center;gap:8px;margin:28px auto 0;width:max-content}
.cell{width:44px;height:50px;border-radius:12px;background:var(--muted-2);font-size:22px;font-weight:500}
.cell.cur{background:var(--muted-2);box-shadow:none;position:relative}
.cell.cur::after{content:'';width:2px;height:22px;background:var(--primary);border-radius:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chk{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--muted-2);border-radius:999px;padding:8px 14px 8px 10px;font:inherit;font-size:13px;color:var(--foreground);cursor:pointer;align-self:center;margin-top:28px}
.chk i{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--border)}
.chk.on i{background:var(--foreground);color:var(--card);box-shadow:none}
.chk .i{width:12px;height:12px;stroke-width:3}
.lf{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.lf .inp{text-align:center;font-size:17px}
.rolebar{flex-wrap:wrap}
.idbox{margin:32px auto 0;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:0;border-radius:20px;padding:16px 28px;cursor:pointer;color:var(--foreground);font:inherit}
.idbox b{font-size:24px;font-weight:600;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.idbox .i{color:var(--muted-foreground)}
.card .inp{background:var(--muted)}
.hint{font-size:12px;color:var(--muted-foreground);line-height:1.45;padding:0 4px}
.uava{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;background:var(--accent);color:var(--accent-foreground)}
.li.off .ct,.li.off .uava{opacity:.45}
</style>
</head>

<div id="app"></div>
<script>
(function () {
'use strict';

/* ---------- иконки ---------- */

function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function say(msg) { clearTimeout(toastT); set({ toast: msg }); toastT = setTimeout(function () { set({ toast: '' }); }, 2400); }
function go(screen, extra) { set(Object.assign({ stack: S.stack.concat([S.screen]), screen: screen }, extra || {})); }
function tab(screen) { set({ screen: screen, stack: [] }); }
function back() { var st = S.stack.slice(); var prev = st.pop() || 'list'; set({ stack: st, screen: prev }); }
var DESKTOP = /[?&]layout=desktop\b/.test(location.search);
function isWide() { return DESKTOP && window.innerWidth >= 1000; }

/* ---------- производные ---------- */
function res(id) { return S.callRes[id]; }
function dropped(c) { var r = res(c.id); return !!r && (r.r === 'hard' || r.r === 'fake'); }
function answered(c) { return !c.sup || c.sup <= S.supArrived; }
function scoreTxt(c) { return c.score ? c.score + '%' : 'уточнить'; }
function scoreSt(c) { return c.score >= 90 ? TONE.good : c.score ? TONE.warn : TONE.muted; }
function chip(t, st) { return '<span class="chip" style="' + st + '">' + esc(t) + '</span>'; }
function tag(c) { var r = res(c.id); return r ? chip(RES[r.r][0], TONE[RES[r.r][1]]) : chip(scoreTxt(c), scoreSt(c)); }
function diffsOf(c) {
  var d = c.diffs.slice(), r = res(c.id);
  if (r && r.r === 'ok') d.push(['ok', 'Подтверждено звонком']);
  if (r && r.r === 'soft') d.push(['warn', 'После звонка ' + r.note]);
  return d;
}
function visible() { return CANDS.filter(function (c) { return answered(c) && !dropped(c); }); }
function pickedList() { return visible().filter(function (c) { return S.picked[c.id]; }); }
function clientStatusChip(key, asBtn) {
  var st = CST[S.cls[key].status];
  if (asBtn) return '<button class="chip" style="' + TONE[st[1]] + '" data-a="openStatus" data-v="' + key + '">' + st[0] + ic('down', 'i-s') + '</button>';
  return chip(st[0], TONE[st[1]]);
}

/* цена клиенту */
function pr(id) {
  if (!S.prices[id]) S.prices[id] = { v: Math.round(BY[id].total * 1.05 / 10000) * 10000, appr: null, apprV: null, hist: [] };
  return S.prices[id];
}
function priceState(id) {
  var c = BY[id], p = pr(id), v = p.v, cost = c.total;
  var margin = (v - cost) / cost * 100, toMed = (v - MARKET.median) / MARKET.median * 100;
  var why = [];
  if (v < cost) return { k: 'below', margin: margin, toMed: toMed, why: ['ниже себестоимости'] };
  if (toMed < -S.rule.median) why.push('ниже медианы рынка больше чем на ' + S.rule.median + '%');
  if (margin < S.rule.margin) why.push('маржа меньше ' + S.rule.margin + '%');
  if (!why.length) return { k: 'ok', margin: margin, toMed: toMed, why: why };
  var k = p.apprV === v ? (p.appr === 'ok' ? 'approved' : p.appr === 'pending' ? 'pending' : p.appr === 'rejected' ? 'rejected' : 'need') : 'need';
  return { k: k, margin: margin, toMed: toMed, why: why };
}
function sendable(id) { var k = priceState(id).k; return k === 'ok' || k === 'approved'; }
function pendingList() { return CANDS.filter(function (c) { return S.prices[c.id] && priceState(c.id).k === 'pending'; }); }

function diffList(c, short) {
  var d = diffsOf(c), shown = short ? d.filter(function (x) { return x[0] !== 'ok'; }) : d, okN = d.length - shown.length;
  return '<div style="display:flex;flex-direction:column;gap:7px">' + shown.map(function (x) {
    var m = DIFF[x[0]];
    return '<div class="diff" style="color:' + m[1] + '">' + ic(m[0], 'i-s') + '<span>' + esc(x[1]) + '</span></div>';
  }).join('') + (short && okN ? '<div class="diff" style="color:var(--success)">' + ic('check', 'i-s') + '<span>Остальное совпадает, ' + okN + ' ' + (okN === 1 ? 'параметр' : okN < 5 ? 'параметра' : 'параметров') + '</span></div>' : '') + '</div>';
}
function priceLine(c) {
  var st = priceState(c.id);
  var badge = st.k === 'pending' ? chip('ждёт владельца', TONE.warn) : st.k === 'need' ? chip('нужно подтверждение', TONE.warn) : st.k === 'rejected' ? chip('отклонено', TONE.bad) : st.k === 'approved' ? chip('подтверждено', TONE.good) : '';
  return '<div class="row sb"><span class="cm">Клиенту ' + rub(pr(c.id).v) + ', маржа ' + pct(st.margin) + '</span>' + badge + '</div>';
}
function vcard(c, top) {
  var on = !!S.picked[c.id], open = !!S.open[c.id];
  var h = '<div class="vcard ' + (on ? 'picked' : '') + '"><div class="vrow">' +
    '<button class="ck ' + (on ? 'on' : '') + '" data-a="pick" data-v="' + c.id + '" aria-label="Выбрать вариант" aria-pressed="' + on + '"><span>' + (on ? ic('check', 'i-s') : '') + '</span></button>' +
    '<button class="vmain" data-a="expand" data-v="' + c.id + '" aria-expanded="' + open + '">' +
    (top ? '<span class="cm" style="font-size:12px">' + esc(top) + '</span>' : '') +
    '<span class="ct">' + esc(c.car) + '</span><span class="cm">' + esc(c.meta) + '</span>' +
    '<span class="row sb" style="padding-top:2px"><span class="price">' + rub(c.total) + '</span>' + tag(c) + '</span></button></div>';
  if (open) {
    h += '<div class="vexp"><div class="seg" style="align-self:flex-start"><button class="' + (S.detail ? '' : 'on') + '" data-a="detail" data-v="0" style="padding:0 14px">Кратко</button><button class="' + (S.detail ? 'on' : '') + '" data-a="detail" data-v="1" style="padding:0 14px">Подробно</button></div>' +
      diffList(c, !S.detail) + '<div class="hr"></div>' + priceLine(c) +
      '<button class="btn b-sm" style="width:100%" data-a="offer" data-v="' + c.id + '">Расчёт и цена клиенту</button></div>';
  }
  return h + '</div>';
}

  var roles = Object.keys(ROLES).map(function (k) { return '<button class="pill ' + (e.role === k ? 'on' : '') + '" data-a="eRole" data-v="' + k + '">' + ROLES[k] + '</button>'; }).join('');
  var h = '<div class="scroll"><div class="card">' +
    '<div class="field"><label for="eid">Telegram ID</label><input id="eid" class="inp" inputmode="numeric" placeholder="например 412345678" data-in="e.id" value="' + esc(e.id) + '"></div>' +
    '<span class="hint">Человек увидит свой ID на экране «Доступа пока нет», когда откроет бота. Ещё его можно узнать у @userinfobot</span>' +
    '<div class="field"><label for="enm">Имя</label><input id="enm" class="inp" placeholder="Как подписать в списке" data-in="e.name" value="' + esc(e.name) + '"></div></div>' +
    '<div class="card"><span class="lbl">Роль</span><div class="wrap" style="gap:8px">' + roles + '</div>' +
    '<span class="hint">' + ({ manager: 'Ведёт свои запросы и клиентов', owner: 'Видит все запросы, подтверждает цены, настраивает правила', supplier: 'Получает анонимные запросы в боте и отвечает вариантами', admin: 'Управляет доступами и настройками' })[e.role] + '</span></div>' +
    '<button class="btn white sb" data-a="eOn">Доступ включён<span class="switch ' + (e.on ? 'on' : '') + '"><span></span></span></button>' +
    '<button class="btn b-acc" data-a="saveUser">' + (e.isNew ? 'Добавить' : 'Сохранить') + '</button>';
  if (!e.isNew) h += '<button class="btn white" style="color:var(--destructive)" data-a="delUser">' + (e.confirmDel ? 'Точно удалить?' : 'Удалить') + '</button>';
  return h + '</div>';
}

function vBoot() { return '<div class="auth" style="justify-content:center"><div class="wm">подбор</div><p class="auth-s">Проверяем доступ</p></div>'; }

var VIEWS = { boot: vBoot, noaccess: vNoAccess, access: vAccess, user: vUser,  login: vLogin, list: vList, lead: vLead, newreq: vNew, supcheck: vSupcheck, card: vCard, offer: vOffer, approve: vApprove, calls: vCalls, reply: vReply, client: vClient, status: vStatus, feedback: vFeedback, more: vMore, settings: vSettings, supplier: vSupplier };

/* ---------- рендер ---------- */
function header(screen, hasBack) {
  var owner = S.role === 'owner';
  var m = META[screen] || ['', ''];
  if (screen === 'list') m = ['Запросы', owner ? 'Все менеджеры' : ''];
  if (screen === 'offer') m = [BY[S.sel].car, BY[S.sel].src];
  if (screen === 'card') m = ['Toyota Camry', 'Создан сегодня в 10:12'];
  if (screen === 'status') m = ['Статус клиента', S.cls[S.stKey].car];
  if (screen === 'user') m = [S.edit.isNew ? 'Новый пользователь' : 'Пользователь', S.edit.isNew ? '' : 'ID ' + S.edit.orig];
  if (screen === 'access') m = ['Доступы', 'Людей: ' + S.users.length];
  var left = hasBack ? '<button class="ib" aria-label="Назад" data-a="back">' + ic('back') + '</button>'
    : screen === 'list' ? '<button class="ib" aria-label="Поиск" data-a="soon">' + ic('search') + '</button>' : '<span class="sp"></span>';
  var right = screen === 'access' ? '<button class="ib dark" aria-label="Добавить пользователя" data-a="newUser">' + ic('plus') + '</button>'
    : screen === 'list' ? '<button class="ib dark" aria-label="Новый лид" data-a="goLead">' + ic('plus') + '</button>'
    : screen === 'supplier' ? '<button class="ib" aria-label="Выйти" data-a="toLogin">' + ic('out') + '</button>' : '<span class="sp"></span>';
  return '<header class="top">' + left + '<div class="top-t"><h1>' + esc(m[0]) + '</h1>' + (m[1] ? '<p>' + esc(m[1]) + '</p>' : '') + '</div>' + right + '</header>';
}
function tabsBar() {
  var owner = S.role === 'owner';
  var tabs = S.role === 'admin' ? [['access', 'Доступы', 'key'], ['settings', 'Настройки', 'sliders'], ['more', 'Профиль', 'user']]
    : owner ? [['list', 'Запросы', 'list'], ['feedback', 'Клиенты', 'users'], ['settings', 'Настройки', 'sliders'], ['more', 'Профиль', 'user']]
    : [['list', 'Запросы', 'list'], ['calls', 'Обзвон', 'phone'], ['feedback', 'Клиенты', 'users'], ['more', 'Профиль', 'user']];
  var cur = S.stack.length ? S.stack[0] : S.screen;
  return '<nav class="tabs" aria-label="Разделы">' + tabs.map(function (t) {
    return '<button class="tab ' + (cur === t[0] ? 'on' : '') + '" data-a="tab" data-v="' + t[0] + '" aria-label="' + t[1] + '"' + (cur === t[0] ? ' aria-current="page"' : '') + '>' + ic(t[2]) + '<span>' + t[1] + '</span></button>';
  }).join('') + '</nav>';
}
function render() {
  var keep = {};
  app.querySelectorAll('.scroll').forEach(function (el) { keep[el.dataset.k || S.lastScreen] = el.scrollTop; });
  var wide = isWide() && S.screen !== 'login' && S.screen !== 'noaccess' && S.screen !== 'boot' && S.screen !== 'supplier' && S.role !== 'admin';
  app.classList.toggle('wide', wide);
  var h = '';
  if (S.screen === 'login' || S.screen === 'noaccess' || S.screen === 'boot') h = VIEWS[S.screen]();
  else if (S.screen === 'supplier') h = header('supplier', false) + vSupplier();
  else if (wide) {
    h = '<div class="pane left">' + header('list', false) + vList() + tabsBar() + '</div><div class="pane right">';
    if (S.screen === 'list') h += '<div class="empty">' + ic('car', 'i-l') + '<b style="color:var(--foreground)">Откройте запрос слева</b></div>';
    else {
      var back = S.stack.length > 0 && !(S.stack.length === 1 && S.stack[0] === 'list');
      h += header(S.screen, back) + VIEWS[S.screen]().replace('class="scroll"', 'class="scroll" data-k="R' + S.screen + '"') + (S.screen === 'card' ? '<div class="dock-wrap">' + dockCard() + '</div>' : '');
    }
    h += '</div>';
  } else {
    h = header(S.screen, S.stack.length > 0) + VIEWS[S.screen]();
    if (S.screen === 'card') h += dockCard();
    else if (!S.stack.length) h += tabsBar();
  }
  if (S.toast) h += '<div class="toast" role="status" aria-live="polite">' + ic('check', 'i-s') + '<span>' + esc(S.toast) + '</span></div>';
  app.innerHTML = h;
  app.querySelectorAll('.scroll').forEach(function (el) {
    var k = el.dataset.k;
    if (k && keep[k] && (k === 'list' || k === 'settings' || S.lastScreen === S.screen)) el.scrollTop = keep[k];
  });
  S.lastScreen = S.screen;
  bindSwipe();
}
window.addEventListener('resize', function () { var w = isWide(); if (w !== S.wasWide) { S.wasWide = w; render(); } });

/* ---------- свайп ---------- */
function bindSwipe() {
  var el = document.getElementById('sw');
  if (!el || S.mm) return;
  var ok = document.getElementById('stOk'), no = document.getElementById('stNo');
  var x0 = null, dx = 0;
  el.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return;
    x0 = e.clientX; dx = 0; el.classList.add('drag');
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  el.addEventListener('pointermove', function (e) {
    if (x0 === null) return;
    dx = e.clientX - x0;
    el.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg)';
    ok.style.opacity = Math.max(0, Math.min(1, dx / 90));
    no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  function end() {
    if (x0 === null) return;
    x0 = null; el.classList.remove('drag');
    if (dx > 90) swipe('ok');
    else if (dx < -90) swipe('no');
    else { el.style.transform = ''; ok.style.opacity = 0; no.style.opacity = 0; }
  }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
function fly(dir, r) {
  var el = document.getElementById('sw');
  if (el) { el.classList.remove('drag'); el.style.transform = 'translateX(' + (dir * 520) + 'px) rotate(' + (dir * 20) + 'deg)'; }
  later(function () {
    var id = CALL_IDS[S.callIdx], cr = Object.assign({}, S.callRes), pk = Object.assign({}, S.picked);
    cr[id] = r;
    if (r.r === 'hard' || r.r === 'fake') delete pk[id];
    set({ callRes: cr, picked: pk, callIdx: S.callIdx + 1, hist: S.hist.concat([id]), mm: '', mmFields: [], fixVals: {}, callNote: '' });
  }, 240);
}
function swipe(dir) {
  if (S.mm) return;
  if (dir === 'ok') fly(1, { r: 'ok', note: '' });
  else set({ mm: 'what', mmFields: [], fixVals: {}, callNote: '' });
}

function startSearch() {
  var cls = Object.assign({}, S.cls); cls.camry = Object.assign({}, cls.camry, { status: 'search' });
  S.log = [['Запрос поставщикам', 'удалено', 'info', 'Имя и телефон клиента', 'сегодня, 10:14']].concat(S.log);
  set({ cls: cls, screen: 'card', stack: ['list'], supArrived: 0, stockOn: false, marketOn: false, picked: {}, open: {}, sent: false });
  later(function () { set({ stockOn: true }); }, 900);
  later(function () { set({ marketOn: true }); }, 1800);
  later(function () { set({ supArrived: 1 }); say('Ответил П-07'); }, 3200);
  later(function () { set({ supArrived: 2 }); say('Ответил П-03'); }, 6000);
}
function setCl(key, patch) { var cls = Object.assign({}, S.cls); cls[key] = Object.assign({}, cls[key], patch); S.cls = cls; }

/* ---------- действия ---------- */
var A = {
  back: back,
  tab: function (v) { tab(v); },
  go: function (v) { go(v); },
  role: function (v) { set({ role: v, loginStep: 0 }); },
  forgot: function () { say('Ссылка для восстановления отправлена'); },
  sendCode: function () { if (S.login.trim() && S.password) set({ loginStep: 1, code: '' }); later(function () { var i = document.getElementById('otp'); if (i) i.focus(); }, 50); },
  remember: function () { set({ remember: !S.remember }); },
  doLogin: function () { if (S.code.length < 6) { say('Введите 6 цифр, в демо подойдут любые'); return; } set({ screen: homeOf(S.role), stack: [], loginStep: 0, code: '' }); },
  sms: function () { say('Код отправлен по SMS'); },
  loginBack: function () { set({ loginStep: 0, code: '' }); },
  openSupplier: function () { set({ screen: 'supplier', stack: [], supStep: 0 }); },
  toLogin: function () { set({ screen: 'login', stack: [], loginStep: 0, code: '' }); },
  logoutAll: function () { set({ screen: 'login', stack: [], loginStep: 0, code: '' }); say('Вы вышли на всех устройствах'); },
  filter: function (v) { set({ listFilter: v }); },
  clFilter: function (v) { set({ clFilter: v }); },
  openCard: function () { if (isWide()) set({ screen: 'card', stack: ['list'] }); else go('card'); },
  demoOnly: function () { say('В демо открыт только Toyota Camry'); },
  soon: function () { say('Поиск в демо не работает'); },
  goLead: function () { if (isWide()) set({ screen: 'lead', stack: ['list'], leadParsed: false }); else go('lead', { leadParsed: false }); },
  leadMode: function (v) { set({ leadMode: v }); },
  leadParse: function () { set({ leadParsed: true }); },
  anketa: function () { set({ anketa: !S.anketa }); },
  leadCreate: function () { go('newreq', { parsed: false, trim: '' }); say('Лид создан, клиент Алексей Морозов'); },
  rec: function () { set({ recording: !S.recording }); },
  parse: function () { set({ parsed: true, recording: false }); },
  trim: function (v) { set({ trim: v === 'Любая' ? 'любая' : v }); },
  sendSup: startSearch,
  callClient: function () { say('Звонок клиенту'); },
  remind: function (v) { say('Напоминание отправлено ' + v); },
  deals: function () { set({ deals: !S.deals }); },
  fold: function (v) { var f = Object.assign({}, S.fold); f[v] = !f[v]; set({ fold: f }); },
  jump: function (v) {
    if (v === 'picked') { if (pickedList().length) A.toClient(); else say('Отметьте варианты галочкой'); return; }
    var f = Object.assign({}, S.fold); f[v] = false; set({ fold: f });
    var el = document.getElementById('sec-' + v); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  pick: function (v) { var p = Object.assign({}, S.picked); if (p[v]) delete p[v]; else { p[v] = true; pr(v); } set({ picked: p }); },
  expand: function (v) { var o = Object.assign({}, S.open); o[v] = !o[v]; pr(v); set({ open: o }); },
  detail: function (v) { set({ detail: v === '1' }); },
  offer: function (v) { go('offer', { sel: v }); },
  askApprove: function (v) { var p = pr(v); p.appr = 'pending'; p.apprV = p.v; p.hist.push([p.v, 'запрос подтверждения', 'Марина К.']); render(); say('Запрос ушёл владельцу'); },
  approve: function (v) { var p = pr(v); p.appr = 'ok'; p.hist.push([p.v, 'подтверждено', 'Владелец']); S.log = [['Цена клиенту', 'подтверждено', 'good', BY[v].car + ', ' + rub(p.v), 'сегодня']].concat(S.log); render(); say('Цена подтверждена'); },
  reject: function (v) { var p = pr(v); p.appr = 'rejected'; p.hist.push([p.v, 'отклонено', 'Владелец']); render(); say('Цена отклонена'); },
  toClient: function () { if (!pickedList().length) { say('Отметьте варианты галочкой'); return; } go('client'); },
  sendMode: function (v) { set({ sendMode: v }); },
  markSent: function () {
    var bl = pickedList().filter(function (c) { return !sendable(c.id); });
    if (bl.length) { say('Сначала подтвердите цену'); return; }
    setCl('camry', { status: 'think' });
    set({ sent: true, kpVer: S.sendMode === 'kp' ? S.kpVer + 1 : S.kpVer });
  },
  backToCard: function () { back(); },
  phone: function () { say('Открываем звонилку'); },
  callOk: function () { swipe('ok'); },
  callNo: function () { swipe('no'); },
  mmPick: function (k) {
    var f = S.mmFields.slice(), on = f.indexOf(k) >= 0;
    if (k === 'fake') f = on ? [] : ['fake'];
    else { f = f.filter(function (x) { return x !== 'fake'; }); f = on ? f.filter(function (x) { return x !== k; }) : f.concat([k]); }
    set({ mmFields: f });
  },
  mmCancel: function () { set({ mm: '', mmFields: [] }); },
  mmNext: function () { if (!S.mmFields.length) return; if (S.mmFields.indexOf('fake') >= 0) fly(-1, { r: 'fake', note: '' }); else set({ mm: 'how' }); },
  mmHard: function () { fly(-1, { r: 'hard', note: mmNote('hard') }); },
  mmSoft: function () { set({ mm: 'fix' }); },
  mmSave: function () { fly(-1, { r: 'soft', note: mmNote('soft') }); },
  mmTo: function (v) { set({ mm: v }); },
  undo: function () {
    var h = S.hist.slice(), id = h.pop();
    if (!id) return;
    var cr = Object.assign({}, S.callRes); delete cr[id];
    set({ hist: h, callRes: cr, callIdx: S.callIdx - 1, mm: '' });
  },
  confirmReply: function () { back(); say('П-07 добавлен в подбор'); },
  toast: function (v) { say(v); },
  openStatus: function (v, el) {
    var cl = S.cls[v];
    var d = { status: (el && el.dataset.s) || cl.status, reasons: cl.reasons.slice(), main: cl.main, note: cl.note };
    go('status', { stKey: v, draft: d });
  },
  stPick: function (v) { S.draft.status = v; render(); },
  stReason: function (v) {
    var d = S.draft, i = d.reasons.indexOf(v);
    if (i >= 0) d.reasons.splice(i, 1); else d.reasons.push(v);
    if (d.reasons.indexOf(d.main) < 0) d.main = d.reasons[0] || '';
    render();
  },
  stMain: function (v) { S.draft.main = v; render(); },
  stSave: function () {
    var d = S.draft;
    if (d.status === 'lost' && !d.reasons.length) { say('Выберите причину'); return; }
    setCl(S.stKey, { status: d.status, reasons: d.status === 'lost' ? d.reasons : [], main: d.status === 'lost' ? d.main : '', note: d.note });
    back();
    say(d.status === 'won' ? 'Заказ создан' : 'Статус ' + CST[d.status][0]);
  },
  stab: function (v) { set({ stab: v }); },
  setv: function (v, el) { var p = {}; p[el.dataset.k] = v; set(p); },
  bump: function (v, el) {
    var k = el.dataset.k, d = +v;
    var lim = { sup: [1, 24], alarm: [2, 48], client: [1, 14], lost: [1, 30], fresh: [15, 360] }[k], step = k === 'fresh' ? 15 : 1;
    var t = Object.assign({}, S.t); t[k] = Math.max(lim[0], Math.min(lim[1], t[k] + d * step)); set({ t: t });
  },
  bumpRule: function (v, el) { var r = Object.assign({}, S.rule); r[el.dataset.k] = Math.max(0, Math.min(30, r[el.dataset.k] + (+v))); set({ rule: r }); },
  bumpKp: function (v) { set({ kpDays: Math.max(1, Math.min(30, S.kpDays + (+v))) }); },
  addReason: function () {
    var r = S.newReason.trim(); if (!r) return;
    var g = S.groups.map(function (x) { return [x[0], x[1].slice()]; }); g[g.length - 1][1].splice(g[g.length - 1][1].length - 1, 0, r);
    set({ groups: g, newReason: '' }); say('Причина добавлена');
  },
  statShare: function () { set({ statShare: !S.statShare }); },
  exclAsk: function (v) { set({ excluding: v }); },
  exclCancel: function () { set({ excluding: '' }); },
  exclDo: function (v, el) { set({ excluding: '', excluded: S.excluded.concat([v]) }); say(el.dataset.n + ' исключён'); },
  sup: function (v) { set({ supStep: +v }); },
  accFilter: function (v) { set({ accFilter: v }); },
  newUser: function () { go('user', { edit: { id: '', name: '', role: 'manager', on: true, isNew: true } }); },
  editUser: function (v) { var u = findUser(v); if (u) go('user', { edit: Object.assign({ orig: u.id }, u) }); },
  eRole: function (v) { S.edit.role = v; render(); },
  eOn: function () { S.edit.on = !S.edit.on; render(); },
  saveUser: function () {
    var e = S.edit, id = String(e.id).trim(), name = String(e.name).trim();
    if (!/^-?\d{5,15}$/.test(id)) { say('Telegram ID это число из цифр'); return; }
    if (!name) { say('Впишите имя'); return; }
    var dup = findUser(id);
    if (dup && (e.isNew || id !== e.orig)) { say('Этот ID уже у ' + dup.name); return; }
    if (online()) {
      call('users.save', { orig: e.isNew ? null : e.orig, tg_id: id, name: name, role: e.role, active: !!e.on })
        .then(refreshUsers).then(function () { back(); say(e.isNew ? name + ' добавлен' : 'Сохранено'); })
        .catch(function (err) { say(errText(err)); });
      return;
    }
    var row = { id: id, name: name, role: e.role, on: !!e.on, added: e.added || new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).replace('.', '') };
    S.users = e.isNew ? S.users.concat([row]) : S.users.map(function (u) { return u.id === e.orig ? row : u; });
    saveUsers();
    if (S.me && S.me.id === e.orig) S.me = row;
    back(); say(e.isNew ? name + ' добавлен' : 'Сохранено');
  },
  delUser: function () {
    var e = S.edit;
    if (!e.confirmDel) { e.confirmDel = true; render(); return; }
    if (online()) {
      call('users.delete', { tg_id: e.orig }).then(refreshUsers).then(function () { back(); say(e.name + ' удалён'); })
        .catch(function (err) { say(errText(err)); });
      return;
    }
    S.users = S.users.filter(function (u) { return u.id !== e.orig; }); saveUsers();
    back(); say(e.name + ' удалён');
  },
  copyId: function (v) { try { navigator.clipboard.writeText(v); } catch (err) {} say('ID скопирован'); },
  recheck: function () { if (online()) { enterOnline(); return; } S.users = loadUsers(); enter(); render(); if (S.screen === 'noaccess') say('Доступа пока нет'); }
};
A.bmwThink = function () { setCl('bmw', { snoozed: true }); say('Спросим ещё раз через ' + days(S.t.lost)); };

app.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (!el) return;
  e.preventDefault();
  var fn = A[el.dataset.a];
  if (fn) fn(el.dataset.v, el);
});
app.addEventListener('input', function (e) {
  var t = e.target, k = t.dataset.in;
  if (!k) return;
  if (k === 'login' || k === 'password') {
    S[k] = t.value;
    var b = document.getElementById('loginBtn');
    if (b) b.className = 'fab ' + (S.login.trim() && S.password ? 'on' : 'off');
  } else if (k === 'code') {
    S.code = t.value.replace(/\D/g, '').slice(0, 6);
    t.value = S.code;
    var box = document.getElementById('otpBox');
    box.querySelectorAll('.cell').forEach(function (c) { c.remove(); });
    box.insertAdjacentHTML('afterbegin', cellsHtml());
    document.getElementById('confirmBtn').className = 'fab ' + (S.code.length === 6 ? 'on' : 'off');
    if (S.code.length === 6) later(function () { set({ screen: homeOf(S.role), stack: [], loginStep: 0, code: '' }); }, 350);
  } else if (k === 'price') {
    var digits = t.value.replace(/\D/g, '');
    var p = pr(S.sel); p.v = +digits || 0;
    var pos = t.value.length - t.selectionStart;
    t.value = digits ? num(p.v) : '';
    try { var np = Math.max(0, t.value.length - pos); t.setSelectionRange(np, np); } catch (err) {}
    document.getElementById('priceInfo').innerHTML = priceInfo(BY[S.sel]);
  } else if (k === 'fix') S.fixVals[t.dataset.k] = t.value;
  else if (k === 'stNote') S.draft.note = t.value;
  else if (k.indexOf('e.') === 0) S.edit[k.slice(2)] = t.value;
  else S[k] = t.value;
});

S.users = loadUsers(); S.accFilter = 'all'; S.edit = null;
if (TG) { try { TG.ready(); TG.expand(); } catch (err) {} }
S.wasWide = isWide();
if (online()) enterOnline(); else enter();
render();
})();
</script>
