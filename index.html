<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F6">
<title>Подбор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#E9EAEE;font-family:'Onest',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
#app{width:100%;max-width:430px;height:100dvh;margin:0 auto;background:#F4F4F6;color:#111214;font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:700px){body{display:flex;align-items:center;justify-content:center;min-height:100vh}#app{height:min(844px,calc(100vh - 40px));max-width:390px;border-radius:36px;box-shadow:0 30px 80px rgba(17,18,20,.18)}}
#app.wide{max-width:none;width:100vw;height:100vh;border-radius:0;box-shadow:none;flex-direction:row;background:#F4F4F6}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;position:relative}
.pane.left{width:400px;flex:none;background:#F4F4F6;box-shadow:1px 0 0 rgba(17,18,20,.06)}
.pane.right{flex:1;background:#EEEFF2}
.pane.right .scroll,.pane.right .dock-wrap{width:100%;max-width:760px;margin:0 auto}
.pane.right .top{width:100%;max-width:760px;margin:0 auto}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#6B6F76}
button,input,textarea{font-family:inherit}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;min-height:66px}
.top-t{flex:1;min-width:0}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top p{margin:2px 0 0;font-size:13px;color:#6B6F76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:14px;border:0;background:#fff;color:#111214;cursor:pointer;padding:0}
.scroll{flex:1;overflow-y:auto;padding:6px 16px 28px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.card{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:16px;border:0;font-size:15px;font-weight:600;cursor:pointer;width:100%;text-decoration:none;flex:none;color:#111214;background:#EEF0F3}
.btn.white{background:#fff}
.b-pri{background:#111214;color:#fff}
.b-acc{background:#2B59FF;color:#fff}
.b-off{background:#E4E5E9;color:#7A7E86}
.b-ghost{background:none;color:#6B6F76;min-height:44px}
.b-sm{min-height:44px;font-size:14px;width:auto;padding:0 14px;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.35;border:0}
button.chip{cursor:pointer;font-family:inherit}
.lbl{font-size:13px;font-weight:500;color:#6B6F76;margin:0}
.muted{color:#6B6F76;font-size:13px;margin:0}
.row{display:flex;align-items:center;gap:8px}
.sb{justify-content:space-between}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i-s{width:16px;height:16px}
.i-l{width:30px;height:30px;stroke-width:1.5}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;padding:6px 8px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 rgba(17,18,20,.05)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;border:0;background:none;font-size:11px;font-weight:600;cursor:pointer;color:#6B6F76}
.tab.on{color:#2B59FF}
.sec-h{display:flex;align-items:baseline;gap:8px;padding:8px 4px 0}
.sec-h h2{margin:0;font-size:17px;font-weight:700;flex:1;letter-spacing:-.01em;text-align:left}
.sec-btn{border:0;background:none;width:100%;cursor:pointer;align-items:center;padding:8px 4px 2px;color:inherit;font-family:inherit}
.sec-btn .chev{transition:transform .2s;color:#9A9EA5}
.sec-btn.closed .chev{transform:rotate(-90deg)}
.cand{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-radius:20px;padding:12px;font-size:15px;color:inherit;cursor:pointer}
.cand-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.thumb{width:56px;height:52px;border-radius:14px;background:#EEF0F3;color:#9A9EA5;display:flex;align-items:center;justify-content:center;flex:none}
.ct{font-weight:600;font-size:15px}
.cm{font-size:13px;color:#6B6F76}
.price{font-weight:600;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:#6B6F76}
.inp{min-height:52px;border:0;border-radius:14px;padding:0 16px;font-size:16px;background:#F1F2F4;color:#111214;width:100%;outline-color:#2B59FF}
textarea.inp{padding:14px 16px;min-height:120px;resize:none;line-height:1.45}
.inp.big{font-size:24px;font-weight:700;min-height:60px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;font-size:14px;margin:0;align-items:center}
.kv dt{color:#6B6F76}
.kv dd{margin:0;text-align:right;font-weight:600}
.seg{display:flex;background:#EEF0F3;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#4A4E55}
.seg button.on{background:#fff;color:#111214;box-shadow:0 1px 3px rgba(17,18,20,.10)}
.toast{position:absolute;left:16px;right:16px;bottom:90px;max-width:420px;margin:0 auto;background:#111214;color:#fff;border-radius:16px;padding:13px 16px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px rgba(17,18,20,.22);z-index:20;animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.banner{border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.4;border:0;text-align:left;width:100%;color:inherit;font-family:inherit}
.banner p{margin:2px 0 0;opacity:.85}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none;scrollbar-width:none}
.pill{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:0;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#111214}
.pill.on{background:#111214;color:#fff}
.pill.soft{background:#EEF0F3}
.pill.soft.on{background:#111214;color:#fff}
.pill.danger.on{background:#B3261E;color:#fff}
.bubble{max-width:86%;border-radius:18px;padding:10px 14px;font-size:14px;line-height:1.45}
.hr{height:1px;background:#F0F1F3}
.diff{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35}
.diff span{color:#111214}
.mask{background:#111214;color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.rm{background:#E4E5E9;color:#6B6F76;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:12px;border:0;background:#EEF0F3;font-size:18px;font-weight:600;cursor:pointer;color:#111214}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0}
.cell{height:56px;border-radius:14px;background:#F1F2F4;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.cell.cur{box-shadow:inset 0 0 0 2px #2B59FF;background:#fff}
.h-big{margin:0;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.sw{position:absolute;inset:0;background:#fff;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:0 12px 32px rgba(17,18,20,.08);transition:transform .24s ease}
.sw.drag{transition:none;cursor:grabbing}
.stamp{position:absolute;top:18px;padding:6px 12px;border-radius:10px;font-weight:700;font-size:15px;letter-spacing:.06em;color:#fff;pointer-events:none;opacity:0}
.ph{background:#E4E6EA;color:#8A8E95;display:flex;align-items:center;justify-content:center;position:relative}
.switch{width:44px;height:26px;border-radius:13px;padding:3px;display:flex;flex:none;background:#C9CCD2;justify-content:flex-start;transition:background .2s}
.switch.on{background:#2B59FF;justify-content:flex-end}
.switch span{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #C4C7CD;flex:none}
.radio.on{border:6px solid #2B59FF}
.vcard{background:#fff;border-radius:20px;overflow:hidden}
.vcard.picked{box-shadow:inset 0 0 0 2px #2B59FF}
.vrow{display:flex;align-items:stretch}
.ck{width:52px;flex:none;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ck span{width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 2px #C4C7CD;display:flex;align-items:center;justify-content:center;color:#fff}
.ck.on span{background:#2B59FF;box-shadow:none}
.vmain{flex:1;min-width:0;border:0;background:none;text-align:left;padding:12px 14px 12px 0;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:3px;font-family:inherit;font-size:15px}
.vexp{padding:0 16px 16px 52px;display:flex;flex-direction:column;gap:10px}
.dock{flex:none;background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;box-shadow:0 -1px 0 rgba(17,18,20,.06)}
.bar{position:relative;height:8px;border-radius:4px;background:#EEF0F3;margin:14px 0 22px}
.bar .rng{position:absolute;top:0;bottom:0;border-radius:4px;background:#D6E0FF}
.bar .mk{position:absolute;top:-5px;width:2px;height:18px;border-radius:1px}
.bar .mk em{position:absolute;top:20px;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:600;white-space:nowrap}
.paper{background:#fff;border-radius:6px;box-shadow:0 8px 24px rgba(17,18,20,.10);padding:22px 20px;font-size:12px;line-height:1.45;color:#111214}
.paper h3{margin:0;font-size:17px}
.sr{position:absolute;left:-9999px}
/* компактность и состояния */
.top{min-height:58px;padding-bottom:8px}
.top h1{font-size:19px}
.scroll{gap:10px;padding:4px 16px 24px}
.scroll>*{flex-shrink:0}
.card{padding:14px;gap:10px;border-radius:18px}
.btn{min-height:48px;transition:transform .12s ease,filter .15s ease,background-color .15s ease}
.btn:active,.cand:active,.pill:active,.ib:active,.tab:active,.li:active,.ck:active,.vmain:active{transform:scale(.98)}
@media (hover:hover){.btn:hover,.pill:hover,.ib:hover{filter:brightness(.96)}.li:hover,.cand:hover{background:#FAFAFB}}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #2B59FF;outline-offset:2px}
[aria-disabled="true"]{cursor:not-allowed}
.group{background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.group>*+*{box-shadow:inset 0 1px 0 #F0F1F3}
.li{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:0;padding:12px 16px;font-family:inherit;font-size:15px;color:inherit;cursor:pointer;transition:background-color .15s ease}
.li.active{background:#F4F6FF}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;padding:10px 12px;border-radius:12px}
.note b{font-weight:600}
.jumpbar{position:sticky;top:-4px;z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:#EEF0F3;padding:4px;border-radius:14px;margin:0 -2px}
.jumpbar button{border:0;background:transparent;border-radius:11px;min-height:44px;font-family:inherit;font-size:12px;font-weight:600;color:#4A4E55;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.2}
.jumpbar button b{font-size:15px;color:#111214}
.jumpbar button.hot{background:#2B59FF;color:#fff}
.jumpbar button.hot b{color:#fff}
.pane.right .jumpbar{top:0}
.cap{font-size:12px;color:#6B6F76;margin-top:-4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

      '<div class="card" style="gap:4px;padding:8px 16px">' + stepRow('bumpKp', 'kp', 'Срок действия цены', days(S.kpDays)) + '</div>';
  } else if (S.stab === 'team') {
    h += '<button class="btn b-acc">Пригласить менеджера</button>' + [['mk', 'Марина Кравец', 'МК', 'Импорт', 3], ['os', 'Олег Сафин', 'ОС', 'Импорт', 5], ['al', 'Артём Лим', 'АЛ', 'Авто в РФ', 2]].map(function (m) {
      var gone = S.excluded.indexOf(m[0]) >= 0, conf = !gone && S.excluding === m[0];
      return '<div class="card"><div class="row" style="gap:12px"><div style="width:42px;height:42px;border-radius:50%;background:#EEF0F3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">' + m[2] + '</div>' +
        '<div style="flex:1;min-width:0"><div style="font-weight:600">' + m[1] + '</div><div class="cm">' + m[3] + ' · ' + (gone ? 0 : m[4]) + ' в работе</div></div>' +
        (gone ? chip('исключён', TONE.bad) : conf ? '' : '<button class="btn b-sm" data-a="exclAsk" data-v="' + m[0] + '">Исключить</button>') + '</div>' +
        (conf ? '<div class="muted" style="color:#8C1D18">Доступ закроется на всех устройствах, запросы перейдут Олегу Сафину</div><div class="g2">' +
          '<button class="btn b-sm" data-a="exclCancel">Отмена</button><button class="btn b-sm" style="background:#B3261E;color:#fff" data-a="exclDo" data-v="' + m[0] + '" data-n="' + m[1] + '">Исключить</button></div>' : '') + '</div>';
    }).join('') + '<div class="card"><b>Контакты поставщиков видит</b>' + seg('visibility', [['platform', 'Только платформа'], ['owner', 'И владелец']]) + '</div>';
  } else if (S.stab === 'api') {
    h += '<div class="card"><div class="row sb"><b>Ключ API</b>' + chip('активен', TONE.good) + '</div>' +
      '<div style="background:#F4F4F6;border-radius:14px;padding:14px 16px;font-size:15px;letter-spacing:.04em">pk_live_••••••••7f3a</div>' +
      '<div class="g2"><button class="btn b-sm" data-a="toast" data-v="Ключ скопирован">' + ic('copy', 'i-s') + 'Скопировать</button><button class="btn b-sm" data-a="toast" data-v="Выпущен новый ключ, старый отключён">' + ic('key', 'i-s') + 'Новый ключ</button></div></div>' +
      '<div class="card" style="gap:10px"><b>Уведомления в CRM</b>' + ['Смена статуса клиента', 'Отправка предложения', 'Заказал или слился'].map(function (x) {
        return '<div class="row sb" style="font-size:14px"><span>' + x + '</span>' + chip('включено', TONE.good) + '</div>';
      }).join('') + '</div>' +
      '<button class="btn white sb" data-a="statShare">Участвовать в обезличенной статистике<span class="switch ' + (S.statShare ? 'on' : '') + '"><span></span></span></button>';
  } else {
    h += S.log.map(function (l) {
      return '<div class="card" style="gap:4px"><div class="row sb"><span class="ct" style="font-size:14px">' + esc(l[0]) + '</span>' + chip(l[1], TONE[l[2]]) + '</div>' +
        '<div style="font-size:13px">' + esc(l[3]) + '</div><div class="cm" style="font-size:12px">' + esc(l[4]) + '</div></div>';
    }).join('');
  }
  return h + '</div>';
}

function vSupplier() {
  var h = '<div class="scroll" style="background:#E6EBF1;gap:10px;padding-top:12px">' +
    '<div class="bubble" style="background:#fff;align-self:flex-start;opacity:.8">Запрос З-5817 Kia Sorento ждёт ответа 2 ч</div>' +
    '<div class="bubble" style="background:#fff;align-self:flex-start"><div style="font-weight:700;margin-bottom:4px">Новый запрос З-5821</div>' +
    '<div>Toyota Camry XV70 рестайлинг</div><div>с 2021 по 2023, до 60 000 км</div><div>белый, серебристый или серый</div><div>до 3 200 000 ₽ под ключ</div></div>';
  if (S.supStep === 0) h += '<div class="g2"><button class="btn b-sm" style="background:#fff;color:#2347D6" data-a="sup" data-v="1">Есть вариант</button><button class="btn b-sm" style="background:#fff;color:#2347D6" data-a="sup" data-v="3">Нет</button></div>';
  if (S.supStep === 1 || S.supStep === 2) h += '<div class="bubble" style="background:#D6F0C6;align-self:flex-end">Есть вариант</div><div class="bubble" style="background:#fff;align-self:flex-start">Пришлите цену, срок, пробег и фото. Можно голосом</div>';
  if (S.supStep === 1) h += '<button class="btn b-pri b-sm" style="width:100%" data-a="sup" data-v="2">Отправить пример ответа</button>';
  if (S.supStep === 2) h += '<div class="bubble" style="background:#D6F0C6;align-self:flex-end">Camry 2022 G, 29к, белая, оценка 4.5, ¥2 150 000. Пишите в WeChat lee_auto88</div><div class="bubble" style="background:#fff;align-self:flex-start">Принято. Контакты не передаются, общение здесь</div>';
  if (S.supStep === 3) h += '<div class="bubble" style="background:#D6F0C6;align-self:flex-end">Нет</div><div class="bubble" style="background:#fff;align-self:flex-start">Спасибо</div>';
  return h + '</div>';
}

var VIEWS = { login: vLogin, list: vList, lead: vLead, newreq: vNew, supcheck: vSupcheck, card: vCard, offer: vOffer, approve: vApprove, calls: vCalls, reply: vReply, client: vClient, status: vStatus, feedback: vFeedback, more: vMore, settings: vSettings, supplier: vSupplier };

/* ---------- рендер ---------- */
function header(screen, hasBack) {
  var owner = S.role === 'owner';
  var m = META[screen] || ['', ''];
  if (screen === 'list') m = ['Запросы', owner ? 'Все менеджеры' : ''];
  if (screen === 'offer') m = [BY[S.sel].car, BY[S.sel].src];
  if (screen === 'card') m = ['Toyota Camry', 'Создан сегодня в 10:12'];
  if (screen === 'status') m = ['Статус клиента', S.cls[S.stKey].car];
  return '<header class="top">' + (hasBack ? '<button class="ib" aria-label="Назад" data-a="back">' + ic('back') + '</button>' : '') +
    '<div class="top-t"><h1>' + esc(m[0]) + '</h1>' + (m[1] ? '<p>' + esc(m[1]) + '</p>' : '') + '</div>' +
    (screen === 'list' ? '<button class="ib" aria-label="Поиск">' + ic('search') + '</button>' : '') +
    (screen === 'supplier' ? '<button class="ib" aria-label="Выйти" data-a="toLogin">' + ic('out') + '</button>' : '') + '</header>';
}
function tabsBar() {
  var owner = S.role === 'owner';
  var tabs = owner ? [['list', 'Запросы', 'list'], ['feedback', 'Клиенты', 'users'], ['settings', 'Настройки', 'sliders'], ['more', 'Профиль', 'user']]
    : [['list', 'Запросы', 'list'], ['calls', 'Обзвон', 'phone'], ['feedback', 'Клиенты', 'users'], ['more', 'Профиль', 'user']];
  var cur = S.stack.length ? S.stack[0] : S.screen;
  return '<nav class="tabs" aria-label="Разделы">' + tabs.map(function (t) {
    return '<button class="tab ' + (cur === t[0] ? 'on' : '') + '" data-a="tab" data-v="' + t[0] + '">' + ic(t[2]) + '<span>' + t[1] + '</span></button>';
  }).join('') + '</nav>';
}
function render() {
  var keep = {};
  app.querySelectorAll('.scroll').forEach(function (el) { keep[el.dataset.k || S.lastScreen] = el.scrollTop; });
  var wide = isWide() && S.screen !== 'login' && S.screen !== 'supplier';
  app.classList.toggle('wide', wide);
  var h = '';
  if (S.screen === 'login') h = VIEWS.login();
  else if (S.screen === 'supplier') h = header('supplier', false) + vSupplier();
  else if (wide) {
    h = '<div class="pane left">' + header('list', false) + vList() + tabsBar() + '</div><div class="pane right">';
    if (S.screen === 'list') h += '<div class="empty">' + ic('car', 'i-l') + '<b style="color:#111214">Откройте запрос слева</b></div>';
    else {
      var back = S.stack.length > 0 && !(S.stack.length === 1 && S.stack[0] === 'list');
      h += header(S.screen, back) + VIEWS[S.screen]().replace('class="scroll"', 'class="scroll" data-k="R' + S.screen + '"') + (S.screen === 'card' ? '<div class="dock-wrap">' + dockCard() + '</div>' : '');
    }
    h += '</div>';
  } else {
    h = header(S.screen, S.stack.length > 0) + VIEWS[S.screen]();
    if (S.screen === 'card') h += dockCard();
    else if (!S.stack.length) h += tabsBar();
  }
  if (S.toast) h += '<div class="toast" role="status" aria-live="polite">' + ic('check', 'i-s') + '<span>' + esc(S.toast) + '</span></div>';
  app.innerHTML = h;
  app.querySelectorAll('.scroll').forEach(function (el) {
    var k = el.dataset.k;
    if (k && keep[k] && (k === 'list' || k === 'settings' || S.lastScreen === S.screen)) el.scrollTop = keep[k];
  });
  S.lastScreen = S.screen;
  bindSwipe();
}
window.addEventListener('resize', function () { var w = isWide(); if (w !== S.wasWide) { S.wasWide = w; render(); } });

/* ---------- свайп ---------- */
function bindSwipe() {
  var el = document.getElementById('sw');
  if (!el || S.mm) return;
  var ok = document.getElementById('stOk'), no = document.getElementById('stNo');
  var x0 = null, dx = 0;
  el.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return;
    x0 = e.clientX; dx = 0; el.classList.add('drag');
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  el.addEventListener('pointermove', function (e) {
    if (x0 === null) return;
    dx = e.clientX - x0;
    el.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg)';
    ok.style.opacity = Math.max(0, Math.min(1, dx / 90));
    no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  function end() {
    if (x0 === null) return;
    x0 = null; el.classList.remove('drag');
    if (dx > 90) swipe('ok');
    else if (dx < -90) swipe('no');
    else { el.style.transform = ''; ok.style.opacity = 0; no.style.opacity = 0; }
  }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
function fly(dir, r) {
  var el = document.getElementById('sw');
  if (el) { el.classList.remove('drag'); el.style.transform = 'translateX(' + (dir * 520) + 'px) rotate(' + (dir * 20) + 'deg)'; }
  later(function () {
    var id = CALL_IDS[S.callIdx], cr = Object.assign({}, S.callRes), pk = Object.assign({}, S.picked);
    cr[id] = r;
    if (r.r === 'hard' || r.r === 'fake') delete pk[id];
    set({ callRes: cr, picked: pk, callIdx: S.callIdx + 1, hist: S.hist.concat([id]), mm: '', mmFields: [], fixVals: {}, callNote: '' });
  }, 240);
}
function swipe(dir) {
  if (S.mm) return;
  if (dir === 'ok') fly(1, { r: 'ok', note: '' });
  else set({ mm: 'what', mmFields: [], fixVals: {}, callNote: '' });
}

function startSearch() {
  var cls = Object.assign({}, S.cls); cls.camry = Object.assign({}, cls.camry, { status: 'search' });
  S.log = [['Запрос поставщикам', 'удалено', 'info', 'Имя и телефон клиента', 'сегодня, 10:14']].concat(S.log);
  set({ cls: cls, screen: 'card', stack: ['list'], supArrived: 0, stockOn: false, marketOn: false, picked: {}, open: {}, sent: false });
  later(function () { set({ stockOn: true }); }, 900);
  later(function () { set({ marketOn: true }); }, 1800);
  later(function () { set({ supArrived: 1 }); say('Ответил П-07'); }, 3200);
  later(function () { set({ supArrived: 2 }); say('Ответил П-03'); }, 6000);
}
function setCl(key, patch) { var cls = Object.assign({}, S.cls); cls[key] = Object.assign({}, cls[key], patch); S.cls = cls; }

/* ---------- действия ---------- */
var A = {
  back: back,
  tab: function (v) { tab(v); },
  go: function (v) { go(v); },
  role: function (v) { set({ role: v, loginStep: 0 }); },
  forgot: function () { say('Ссылка для восстановления отправлена'); },
  sendCode: function () { if (S.login.trim() && S.password) set({ loginStep: 1, code: '' }); later(function () { var i = document.getElementById('otp'); if (i) i.focus(); }, 50); },
  remember: function () { set({ remember: !S.remember }); },
  doLogin: function () { if (S.code.length < 6) { say('Введите 6 цифр, в демо подойдут любые'); return; } set({ screen: 'list', stack: [], loginStep: 0, code: '' }); },
  sms: function () { say('Код отправлен по SMS'); },
  loginBack: function () { set({ loginStep: 0, code: '' }); },
  openSupplier: function () { set({ screen: 'supplier', stack: [], supStep: 0 }); },
  toLogin: function () { set({ screen: 'login', stack: [], loginStep: 0, code: '' }); },
  logoutAll: function () { set({ screen: 'login', stack: [], loginStep: 0, code: '' }); say('Вы вышли на всех устройствах'); },
  filter: function (v) { set({ listFilter: v }); },
  clFilter: function (v) { set({ clFilter: v }); },
  openCard: function () { if (isWide()) set({ screen: 'card', stack: ['list'] }); else go('card'); },
  demoOnly: function () { say('В демо открыт только Toyota Camry'); },
  goLead: function () { if (isWide()) set({ screen: 'lead', stack: ['list'], leadParsed: false }); else go('lead', { leadParsed: false }); },
  leadMode: function (v) { set({ leadMode: v }); },
  leadParse: function () { set({ leadParsed: true }); },
  anketa: function () { set({ anketa: !S.anketa }); },
  leadCreate: function () { go('newreq', { parsed: false, trim: '' }); say('Лид создан, клиент Алексей Морозов'); },
  rec: function () { set({ recording: !S.recording }); },
  parse: function () { set({ parsed: true, recording: false }); },
  trim: function (v) { set({ trim: v === 'Любая' ? 'любая' : v }); },
  sendSup: startSearch,
  callClient: function () { say('Звонок клиенту'); },
  remind: function (v) { say('Напоминание отправлено ' + v); },
  deals: function () { set({ deals: !S.deals }); },
  fold: function (v) { var f = Object.assign({}, S.fold); f[v] = !f[v]; set({ fold: f }); },
  jump: function (v) {
    if (v === 'picked') { if (pickedList().length) A.toClient(); else say('Отметьте варианты галочкой'); return; }
    var f = Object.assign({}, S.fold); f[v] = false; set({ fold: f });
    var el = document.getElementById('sec-' + v); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  pick: function (v) { var p = Object.assign({}, S.picked); if (p[v]) delete p[v]; else { p[v] = true; pr(v); } set({ picked: p }); },
  expand: function (v) { var o = Object.assign({}, S.open); o[v] = !o[v]; pr(v); set({ open: o }); },
  detail: function (v) { set({ detail: v === '1' }); },
  offer: function (v) { go('offer', { sel: v }); },
  askApprove: function (v) { var p = pr(v); p.appr = 'pending'; p.apprV = p.v; p.hist.push([p.v, 'запрос подтверждения', 'Марина К.']); render(); say('Запрос ушёл владельцу'); },
  approve: function (v) { var p = pr(v); p.appr = 'ok'; p.hist.push([p.v, 'подтверждено', 'Владелец']); S.log = [['Цена клиенту', 'подтверждено', 'good', BY[v].car + ', ' + rub(p.v), 'сегодня']].concat(S.log); render(); say('Цена подтверждена'); },
  reject: function (v) { var p = pr(v); p.appr = 'rejected'; p.hist.push([p.v, 'отклонено', 'Владелец']); render(); say('Цена отклонена'); },
  toClient: function () { if (!pickedList().length) { say('Отметьте варианты галочкой'); return; } go('client'); },
  sendMode: function (v) { set({ sendMode: v }); },
  markSent: function () {
    var bl = pickedList().filter(function (c) { return !sendable(c.id); });
    if (bl.length) { say('Сначала подтвердите цену'); return; }
    setCl('camry', { status: 'think' });
    set({ sent: true, kpVer: S.sendMode === 'kp' ? S.kpVer + 1 : S.kpVer });
  },
  backToCard: function () { back(); },
  phone: function () { say('Открываем звонилку'); },
  callOk: function () { swipe('ok'); },
  callNo: function () { swipe('no'); },
  mmPick: function (k) {
    var f = S.mmFields.slice(), on = f.indexOf(k) >= 0;
    if (k === 'fake') f = on ? [] : ['fake'];
    else { f = f.filter(function (x) { return x !== 'fake'; }); f = on ? f.filter(function (x) { return x !== k; }) : f.concat([k]); }
    set({ mmFields: f });
  },
  mmCancel: function () { set({ mm: '', mmFields: [] }); },
  mmNext: function () { if (!S.mmFields.length) return; if (S.mmFields.indexOf('fake') >= 0) fly(-1, { r: 'fake', note: '' }); else set({ mm: 'how' }); },
  mmHard: function () { fly(-1, { r: 'hard', note: mmNote('hard') }); },
  mmSoft: function () { set({ mm: 'fix' }); },
  mmSave: function () { fly(-1, { r: 'soft', note: mmNote('soft') }); },
  mmTo: function (v) { set({ mm: v }); },
  undo: function () {
    var h = S.hist.slice(), id = h.pop();
    if (!id) return;
    var cr = Object.assign({}, S.callRes); delete cr[id];
    set({ hist: h, callRes: cr, callIdx: S.callIdx - 1, mm: '' });
  },
  confirmReply: function () { back(); say('П-07 добавлен в подбор'); },
  toast: function (v) { say(v); },
  openStatus: function (v, el) {
    var cl = S.cls[v];
    var d = { status: (el && el.dataset.s) || cl.status, reasons: cl.reasons.slice(), main: cl.main, note: cl.note };
    go('status', { stKey: v, draft: d });
  },
  stPick: function (v) { S.draft.status = v; render(); },
  stReason: function (v) {
    var d = S.draft, i = d.reasons.indexOf(v);
    if (i >= 0) d.reasons.splice(i, 1); else d.reasons.push(v);
    if (d.reasons.indexOf(d.main) < 0) d.main = d.reasons[0] || '';
    render();
  },
  stMain: function (v) { S.draft.main = v; render(); },
  stSave: function () {
    var d = S.draft;
    if (d.status === 'lost' && !d.reasons.length) { say('Выберите причину'); return; }
    setCl(S.stKey, { status: d.status, reasons: d.status === 'lost' ? d.reasons : [], main: d.status === 'lost' ? d.main : '', note: d.note });
    back();
    say(d.status === 'won' ? 'Заказ создан' : 'Статус ' + CST[d.status][0]);
  },
  stab: function (v) { set({ stab: v }); },
  setv: function (v, el) { var p = {}; p[el.dataset.k] = v; set(p); },
  bump: function (v, el) {
    var k = el.dataset.k, d = +v;
    var lim = { sup: [1, 24], alarm: [2, 48], client: [1, 14], lost: [1, 30], fresh: [15, 360] }[k], step = k === 'fresh' ? 15 : 1;
    var t = Object.assign({}, S.t); t[k] = Math.max(lim[0], Math.min(lim[1], t[k] + d * step)); set({ t: t });
  },
  bumpRule: function (v, el) { var r = Object.assign({}, S.rule); r[el.dataset.k] = Math.max(0, Math.min(30, r[el.dataset.k] + (+v))); set({ rule: r }); },
  bumpKp: function (v) { set({ kpDays: Math.max(1, Math.min(30, S.kpDays + (+v))) }); },
  addReason: function () {
    var r = S.newReason.trim(); if (!r) return;
    var g = S.groups.map(function (x) { return [x[0], x[1].slice()]; }); g[g.length - 1][1].splice(g[g.length - 1][1].length - 1, 0, r);
    set({ groups: g, newReason: '' }); say('Причина добавлена');
  },
  statShare: function () { set({ statShare: !S.statShare }); },
  exclAsk: function (v) { set({ excluding: v }); },
  exclCancel: function () { set({ excluding: '' }); },
  exclDo: function (v, el) { set({ excluding: '', excluded: S.excluded.concat([v]) }); say(el.dataset.n + ' исключён'); },
  sup: function (v) { set({ supStep: +v }); }
};
A.bmwThink = function () { setCl('bmw', { snoozed: true }); say('Спросим ещё раз через ' + days(S.t.lost)); };

app.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (!el) return;
  e.preventDefault();
  var fn = A[el.dataset.a];
  if (fn) fn(el.dataset.v, el);
});
app.addEventListener('input', function (e) {
  var t = e.target, k = t.dataset.in;
  if (!k) return;
  if (k === 'login' || k === 'password') {
    S[k] = t.value;
    var b = document.getElementById('loginBtn');
    if (b) b.className = 'btn ' + (S.login.trim() && S.password ? 'b-acc' : 'b-off');
  } else if (k === 'code') {
    S.code = t.value.replace(/\D/g, '').slice(0, 6);
    t.value = S.code;
    var box = document.getElementById('otpBox');
    box.querySelectorAll('.cell').forEach(function (c) { c.remove(); });
    box.insertAdjacentHTML('afterbegin', cellsHtml());
    document.getElementById('confirmBtn').className = 'btn ' + (S.code.length === 6 ? 'b-acc' : 'b-off');
    if (S.code.length === 6) later(function () { set({ screen: 'list', stack: [], loginStep: 0, code: '' }); }, 350);
  } else if (k === 'price') {
    var digits = t.value.replace(/\D/g, '');
    var p = pr(S.sel); p.v = +digits || 0;
    var pos = t.value.length - t.selectionStart;
    t.value = digits ? num(p.v) : '';
    try { var np = Math.max(0, t.value.length - pos); t.setSelectionRange(np, np); } catch (err) {}
    document.getElementById('priceInfo').innerHTML = priceInfo(BY[S.sel]);
  } else if (k === 'fix') S.fixVals[t.dataset.k] = t.value;
  else if (k === 'stNote') S.draft.note = t.value;
  else S[k] = t.value;
});

S.wasWide = isWide();
render();
})();
</script>
